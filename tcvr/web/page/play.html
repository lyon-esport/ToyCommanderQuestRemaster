<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy Commander</title>
<style>
  :root { color-scheme: dark; --bg: #111; --panel: #1c1c1c; --line: #333; --text: #ddd; --dim: #999; --accent: #f0b429; --ok: #5ac46e; --bad: #e36060; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
  #wrap { display: flex; gap: 16px; justify-content: center; padding: 16px; flex-wrap: wrap; }
  #game { width: min(960px, calc(100vw - 400px)); min-width: 480px; max-width: 100%; aspect-ratio: 4 / 3; }
  #mp { width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; align-self: flex-start; }
  #mp h2 { margin: 0 0 10px; font-size: 16px; }
  #mp .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  #mp input { background: #000; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; font: inherit; }
  #mp input.name { width: 4em; text-transform: uppercase; }
  #mp button { background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #mp button.main { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  #mp button:disabled { opacity: .5; cursor: default; }
  #mp ul { list-style: none; padding: 0; margin: 6px 0; }
  #mp li { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #mp .dim { color: var(--dim); font-size: 12px; }
  #mp .ready { color: var(--ok); }
  #mp .msg { color: var(--bad); margin: 6px 0; }
  #start { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #000; border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 16px; box-sizing: border-box; }
  #start h1 { margin: 0; font-size: 26px; }
  #start button { background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 6px; padding: 10px 18px; font: inherit; font-size: 16px; cursor: pointer; }
  #start button.main { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  #start button:disabled { opacity: .5; cursor: default; }
  #start .dim { color: var(--dim); font-size: 13px; }
  #start input { background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; font-size: 16px; width: 4em; text-transform: uppercase; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game"></div>
  <div id="mp"><h2>Multiplayer</h2><div id="mpBody" class="dim">Starting the game...</div></div>
</div>
<script>
// Toy Commander in the browser, with the LAN multiplayer of the Quest and PC apps: this page joins a game
// hosted on a headset or a PC (the local server talks to the lobby for it: tcvr/web/lobby.py). On START the
// page loads again as a match (?peers=...), from the host's start state, and the game's own setup enters the
// host's settings (core/network/tcvr_match.cpp), exactly as on the other players' copies.
const params = new URLSearchParams(location.search);
const MATCH = params.get('peers');
const GAME_URL = params.get('elf') ? '/disc/test.elf' : '/disc/ToyCommander.chd';	// ?elf=1: cloud checks without the game
const CORE_URL = 'data/cores/tcvr-wasm.data';
window._tcvrSyncAll = params.get('syncall') === '1';	// tests: the core keeps a RAM hash per frame (as index.html)
let cid = '';
try { cid = sessionStorage.getItem('tcvrCid') || ''; } catch (e) {}
if (!cid) {
  cid = Math.random().toString(36).slice(2, 12);
  try { sessionStorage.setItem('tcvrCid', cid); } catch (e) {}
}
const api = (path) => path + (path.includes('?') ? '&' : '?') + 'cid=' + encodeURIComponent(cid);
const cmd = (obj) => fetch(api('/lobby/cmd'), { method: 'POST', body: JSON.stringify(obj) }).catch(() => {});
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function bootEmulator() {
  window.EJS_player = '#game';
  window.EJS_core = 'tcvr';
  window.EJS_gameName = 'Toy Commander (Europe)';
  window.EJS_gameUrl = GAME_URL;
  window.EJS_cacheConfig = { enabled: true, cacheMaxSizeMB: 4096, cacheMaxAgeMins: 60 * 24 * 365 };	// the downloaded game stays a year (start screen: Clean storage)
  window.EJS_pathtodata = 'data/';
  window.EJS_startOnLoaded = true;
  window.EJS_threads = false;
  window.EJS_disableLocalStorage = true;
  window.EJS_defaultOptions = {
    'reicast_hle_bios': 'enabled',
    'reicast_broadcast': 'NTSC',
    'reicast_internal_resolution': '640x480',
    'reicast_threaded_rendering': 'disabled',
    'reicast_alpha_sorting': 'per-strip (fast, least accurate)',
    'reicast_frame_skipping': 'disabled',
    'reicast_gdrom_fast_loading': 'enabled',
    'reicast_enable_dsp': 'disabled',	// online the settings check compares it with the Quest and PC
    'reicast_per_content_vmus': 'VMU A1',	// the game's save card in /data/saves: the player's profile (profiles below)
  };
  for (const src of ['tcvrnet.js', 'data/loader.js']) {
    const s = document.createElement('script');
    s.src = src;
    s.async = false;
    document.body.appendChild(s);
  }
}

const body = document.getElementById('mpBody');
const MODES = ['Deathmatch', 'Cat and Mice', 'Capture the Flag'];
// core/network/tcvr_lobby.cpp RoomNames
const ROOMS = ['Kitchen and dining room', "Two children's bedrooms", 'Hallway and its mezzanine', "Parent's bedroom",
  'Garage and tool room', 'Attic', 'Living room and winter garden', 'Cellar'];
const settingsText = (s) => `${MODES[s.mode] || 'Game'}, ${ROOMS[s.room] || 'room ' + (s.room + 1)}`;

let myName = 'WEB';
try { myName = localStorage.getItem('tcvrName') || 'WEB'; } catch (e) {}
let shown = '';
function render(html) { if (html !== shown) { shown = html; body.innerHTML = html; } }

async function goToMatch(v) {
  // everything the match page needs is in its address; the start state is fetched again there
  const st = v.state || { players: [] };
  const names = st.players.filter((p) => p.present).map((p) => p.name).join(',');
  const s = v.start.settings;
  const q = new URLSearchParams({
    peers: v.peers, player: v.start.localIndex, delay: v.start.inputDelay,
    mpsetup: `${s.mode},${s.room},${s.points},${v.start.snapshot ? 1 : 0}`, mpnames: names,
  });
  if (v.start.snapshot) q.set('snap', v.start.snapshot);
  for (const k of ['elf', 'syncall']) if (params.get(k)) q.set(k, params.get(k));	// test switches survive the reload
  location.replace(location.pathname + '?' + q.toString());
}

async function lobbyLoop() {
  if (!window._tcvrIdentity) {
    render('<span class="dim">The multiplayer games show here once the game has started.</span>');
    return;
  }
  let v;
  try { v = await (await fetch(api('/lobby/view'))).json(); } catch (e) { render('<div class="msg">The local server does not answer.</div>'); return; }
  if (v.phase === 'started' && v.start) { render('<b>The match is starting...</b>'); goToMatch(v); return; }
  if (v.phase === 'connecting') { render('<span class="dim">Joining the game...</span>'); return; }
  if (v.phase === 'inLobby' && v.state) {
    const st = v.state;
    const players = st.players.map((p, i) => p.present
      ? `<li><span>${esc(p.name)}${i === st.hostSlot ? ' <span class="dim">(host)</span>' : ''}${i === v.mySlot ? ' <span class="dim">(you)</span>' : ''}</span>` +
        `<span class="${p.ready || i === st.hostSlot ? 'ready' : 'dim'}">${i === st.hostSlot ? '' : p.ready ? 'Ready' : 'Not ready'}</span></li>`
      : '').join('');
    const waiting = v.snapshots.length ? '' : '<div class="dim">Getting the match start from the host...</div>';
    render(`<div>${esc(settingsText(st.settings))}</div><ul>${players}</ul>${waiting}` +
      `<div class="row"><button class="main" id="ready">${v.ready ? 'Not ready' : 'Ready'}</button><button id="leave">Leave</button></div>` +
      `<div class="dim">The host starts the match when everybody is ready.</div>`);
    document.getElementById('ready').onclick = () => cmd({ op: 'ready', ready: !v.ready }).then(lobbyLoop);
    document.getElementById('leave').onclick = () => cmd({ op: 'leave' }).then(lobbyLoop);
    return;
  }
  let games = [];
  try { games = await (await fetch('/lobby/games')).json(); } catch (e) {}
  const id = window._tcvrIdentity;
  const list = games.map((g, k) => {
    const other = g.version !== id.version ? 'another app version' : g.started ? 'playing' : g.players >= g.maxPlayers ? 'full' : '';
    return `<li><span>${esc(g.hostName)} <span class="dim">${esc(g.modeName)}, ${g.players}/${g.maxPlayers}</span></span>` +
      (other ? `<span class="dim">${other}</span>` : `<button class="main" data-k="${k}">Join</button>`) + '</li>';
  }).join('');
  const msg = v.phase === 'refused' || v.phase === 'hostLeft' || v.phase === 'failed' ? `<div class="msg">${esc(v.message)}</div>` : '';
  render(`${msg}<div class="row">Your name <input class="name" id="name" maxlength="3" value="${esc(myName)}"></div>` +
    (list ? `<ul>${list}</ul>` : '<div class="dim">Looking for games on this network... Create a game on a headset or a PC.</div>') +
    `<div class="row"><input id="addr" placeholder="Address" size="14"><button id="ask">Find</button></div>`);
  const nameInput = document.getElementById('name');
  nameInput.onchange = () => { myName = (nameInput.value || 'WEB').toUpperCase().slice(0, 3); try { localStorage.setItem('tcvrName', myName); } catch (e) {} };
  document.getElementById('ask').onclick = () => cmd({ op: 'query', address: document.getElementById('addr').value.trim() });
  for (const b of body.querySelectorAll('button[data-k]')) {
    const g = games[+b.dataset.k];
    b.onclick = () => cmd({ op: 'join', address: g.address, port: g.lobbyPort, name: myName, version: id.version, disc: id.disc }).then(lobbyLoop);
  }
}

// Player profiles: the game's save card (VMU, in /data/saves) is kept by the local server under the player's
// name (serve.py /profile), so a player who comes back gets it from any browser or device. Matches use a blank
// card in memory (the same on every player's copy), so only solo play reads and writes the profile.
const SAVES = '/data/saves';
let profileName = '';
let profileSent = '';
const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
function savesFS() { const e = window.EJS_emulator; return e && e.gameManager && e.gameManager.FS; }
function readSaves(FS) {
  const files = {};
  try { for (const f of FS.readdir(SAVES)) if (f !== '.' && f !== '..' && FS.isFile(FS.stat(SAVES + '/' + f).mode)) files[f] = b64(FS.readFile(SAVES + '/' + f)); } catch (e) {}
  return files;
}
async function profileLoad(name) {
  let prof = { files: {} };
  try { const r = await fetch('/profile?name=' + encodeURIComponent(name)); if (r.ok) prof = await r.json(); } catch (e) {}
  // once EmulatorJS has mounted the save folder, before the game starts: this player's files only
  const hook = setInterval(() => {
    if (!window.EJS_emulator || !window.EJS_emulator.on) return;
    clearInterval(hook);
    window.EJS_emulator.on('saveDatabaseLoaded', (FS) => {
      try {
        for (const f of FS.readdir(SAVES)) if (f !== '.' && f !== '..' && FS.isFile(FS.stat(SAVES + '/' + f).mode)) FS.unlink(SAVES + '/' + f);
        for (const [f, data] of Object.entries(prof.files || {})) FS.writeFile(SAVES + '/' + f, unb64(data));
        profileSent = JSON.stringify(readSaves(FS));
        console.log('tcvr profile ' + name + ': ' + Object.keys(prof.files || {}).length + ' file(s) loaded');
      } catch (e) { console.warn('tcvr profile load', e); }
    });
  }, 20);
  setInterval(() => profileSave(false), 15000);
  addEventListener('pagehide', () => profileSave(true));
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') profileSave(true); });
}
function profileSave(leaving) {
  const FS = savesFS();
  if (!profileName || !FS || !window.EJS_emulator.started) return;
  const body = JSON.stringify(readSaves(FS));
  if (body === profileSent || body === '{}') return;
  const payload = '{"files":' + body + '}';
  const url = '/profile?name=' + encodeURIComponent(profileName);
  if (leaving && navigator.sendBeacon) { if (navigator.sendBeacon(url, payload)) profileSent = body; return; }
  fetch(url, { method: 'POST', body: payload }).then((r) => { if (r.ok) profileSent = body; }).catch(() => {});
}

// Start screen: the game files (disc image and emulator) are downloaded once and kept by the browser
// (EmulatorJS cache, IndexedDB 'EmulatorJS-Cache'). The player chooses to download them, or to play when
// they are already there, or to clean that storage.
const CACHE_DB = 'EmulatorJS-Cache';
const mb = (n) => (n / 1048576).toFixed(0) + ' MB';
async function headSize(url) {
  try { const r = await fetch(url, { method: 'HEAD' }); return +(r.headers.get('Content-Length') || 0); } catch (e) { return 0; }
}
async function cachedFiles() {
  // never create the database here: EmulatorJS creates it with its stores on first use
  try {
    if (indexedDB.databases) {
      const dbs = await indexedDB.databases();
      if (!dbs.some((d) => d.name === CACHE_DB)) return { game: 0, core: 0, total: 0 };
    }
    const db = await new Promise((ok, no) => {
      const rq = indexedDB.open(CACHE_DB);
      rq.onupgradeneeded = () => { rq.transaction.abort(); };
      rq.onsuccess = () => ok(rq.result);
      rq.onerror = () => no(rq.error);
    });
    try {
      if (!db.objectStoreNames.contains('cache')) return { game: 0, core: 0, total: 0 };
      const items = await new Promise((ok, no) => {
        const rq = db.transaction('cache', 'readonly').objectStore('cache').getAll();
        rq.onsuccess = () => ok(rq.result || []);
        rq.onerror = () => no(rq.error);
      });
      const find = (end) => items.filter((i) => String(i.url || '').endsWith(end)).reduce((n, i) => n + (i.fileSize || 0), 0);
      return { game: find(GAME_URL.split('/').pop()), core: find(CORE_URL.split('/').pop()), total: items.reduce((n, i) => n + (i.fileSize || 0), 0) };
    } finally { db.close(); }
  } catch (e) { return { game: 0, core: 0, total: 0 }; }
}
function cleanStorage() {
  return new Promise((ok) => {
    const rq = indexedDB.deleteDatabase(CACHE_DB);
    rq.onsuccess = rq.onerror = () => ok();
    rq.onblocked = () => ok();
  });
}
async function startScreen() {
  const game = document.getElementById('game');
  game.innerHTML = '<div id="start"><h1>Toy Commander</h1><div class="dim">Checking the game files...</div></div>';
  const box = document.getElementById('start');
  const [gameSize, coreSize, have] = await Promise.all([headSize(GAME_URL), headSize(CORE_URL), cachedFiles()]);
  const ready = have.game > 0 && (!gameSize || have.game >= gameSize);
  const need = (ready ? 0 : gameSize) + (have.core > 0 ? 0 : coreSize);
  let html = '<h1>Toy Commander</h1>';
  if (ready) {
    html += `<div>The game files are already on this device (${mb(have.total)}).</div>` +
      `<button class="main" id="go">Play</button>`;
  } else {
    html += `<div>This device needs the game files first: ${need ? mb(need) : 'size unknown'}.<br><span class="dim">They are downloaded once from this local server and kept by the browser.</span></div>` +
      `<button class="main" id="go">Download game files${need ? ' (' + mb(need) + ')' : ''}</button>`;
  }
  html += `<div class="dim">Your name <input id="pname" maxlength="3" value="${esc(myName)}"> keeps your saves on this server.</div>`;
  html += have.total ? `<button id="clean">Clean storage (${mb(have.total)})</button><div class="dim">Removes the downloaded game files from this browser.</div>` : '';
  box.innerHTML = html;
  document.getElementById('go').onclick = async () => {
    const n = (document.getElementById('pname').value || 'WEB').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'WEB';
    myName = profileName = n;
    try { localStorage.setItem('tcvrName', n); } catch (e) {}
    document.getElementById('go').disabled = true;
    await profileLoad(n);
    game.innerHTML = '';
    bootEmulator();
  };
  const clean = document.getElementById('clean');
  if (clean) clean.onclick = async () => {
    clean.disabled = true;
    clean.textContent = 'Cleaning...';
    await cleanStorage();
    startScreen();
  };
}

if (MATCH) {
  // a match: the host's start state first (raw bytes for the core), then the game
  render('<b>Match</b><div class="dim">Starting with the other players...</div><div class="row"><button id="back">Back to the lobby</button></div>');
  document.getElementById('back').onclick = async () => { await cmd({ op: 'matchOver' }); const keep = new URLSearchParams(); for (const k of ['elf', 'syncall']) if (params.get(k)) keep.set(k, params.get(k)); location.replace(location.pathname + (keep.toString() ? '?' + keep : '')); };
  const snap = params.get('snap');
  (snap ? fetch(api('/lobby/snap?id=' + encodeURIComponent(snap))).then((r) => r.ok ? r.arrayBuffer() : null) : Promise.resolve(null))
    .then((buf) => { if (buf) window._tcvrMatchState = new Uint8Array(buf); })
    .catch(() => {})
    .finally(bootEmulator);
} else {
  startScreen();	// a match page starts at once: the player already chose on the lobby page
  setInterval(() => { if (document.activeElement && document.activeElement.tagName === 'INPUT') return; lobbyLoop(); }, 1000);
}
</script>
</body>
</html>
